<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  // 카카오톡 인앱 브라우저는 target="_blank"를 무시하고 같은 화면에서 이동시켜, 상품 링크를
  // 눌렀다 돌아오면 링크트리가 아니라 토스/쿠팡 중간 페이지가 남아있는 문제가 있음(인앱 브라우저
  // 자체의 제약, target=_blank로는 해결 불가). 카톡 안에서 열렸으면 즉시 외부 브라우저로 이동시켜
  // 우회 — 외부 브라우저에서는 상품 링크가 정상적으로 새 탭에서 열려 이 페이지가 그대로 유지됨.
  (function () {
    var ua = navigator.userAgent.toLowerCase();
    if (ua.indexOf("kakaotalk") === -1) return;
    var url = location.href;
    if (/iphone|ipad|ipod/.test(ua)) {
      location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url);
    } else {
      location.href = "intent://" + url.replace(/^https?:\/\//, "") + "#Intent;scheme=https;end";
    }
  })();
</script>
<title>🔥 오늘의 핫딜 모아보기 🔥</title>
<meta name="description" content="품절·가격 변동시 핫딜 종료!" />
<meta name="google-site-verification" content="6t9J30u7yTvOGZKe74WqyAVfSh2fBE6YAcp54XRtedM" />
<meta property="og:type" content="website" />
<meta property="og:title" content="🔥 오늘의 핫딜 모아보기 🔥" />
<meta property="og:description" content="품절·가격 변동시 핫딜 종료!" />
<meta property="og:url" content="https://hotdeal-fairy.github.io/hotdeal/" />
<meta property="og:image" content="https://hotdeal-fairy.github.io/hotdeal/images/og-image.jpg?v=2" />
<!-- style.css 수정 시마다 ?v= 뒤 숫자를 올려 브라우저 캐시 무효화 (별도 빌드 단계가 없는 정적 사이트라 수동 관리) -->
<link rel="stylesheet" href="style.css?v=11" />
</head>
<body>

<main>
  <div class="profile" id="profile"></div>

  <div id="openchat"></div>

  <div id="banners"></div>

  <div class="mall-tabs" id="mall-tabs"></div>
  <p class="mall-disclosure" id="mall-disclosure"></p>
  <p class="mall-updated-at" id="mall-updated-at"></p>
  <div id="products"></div>

  <p class="status" id="status" hidden>불러오는 중 문제가 발생했어요.</p>
</main>

<script>
  fetch("data.json")
    .then((res) => res.json())
    .then(render)
    .catch(() => {
      document.getElementById("status").hidden = false;
    });

  // data.json의 상품명 등은 카카오톡 채팅 원문에서 그대로 파싱된 값이라(운영자가 직접
  // 입력하는 값이 아님) 악의적인 참여자가 "<img src=x onerror=...>" 같은 마크업을 상품명에
  // 섞어 넣으면 그대로 innerHTML에 꽂혀 실행될 수 있었다(저장형 XSS) — 텍스트로 렌더링하는
  // 모든 사용자 유래 필드는 이 함수로 이스케이프한다.
  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  // escapeHtml()은 HTML 특수문자만 막을 뿐 href/src에 들어가는 URL 스킴(javascript: 등)은
  // 막지 못한다 — data.json 값이 전부 외부(쿠팡/토스) 스크래핑 출처라 신뢰할 수 없는 입력으로
  // 취급해야 하므로, http(s):// 또는 프로토콜-상대(//)로 시작하는 값만 통과시키고 그 외(빈
  // 문자열 포함)는 빈 문자열로 치환한다(2026-07-24 전체 프로젝트 감사 중 발견, TW90 XSS
  // 수정의 잔여 갭). href/src에 쓸 때도 escapeHtml과 함께 적용해 속성 탈출까지 방어한다.
  function sanitizeUrl(url) {
    const s = String(url ?? "").trim();
    if (/^(https?:)?\/\//i.test(s)) return s; // 절대경로/프로토콜 상대경로
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) return ""; // javascript:/data: 등 위험 스킴 차단
    return s; // 스킴 없는 상대경로("images/profile.jpg" 등, 프로필 아바타 전용)는 안전하므로 허용
  }


  function formatRelativeTime(ts) {
    const diffMin = (Date.now() / 1000 - ts) / 60;
    if (diffMin < 1) return "방금";
    if (diffMin < 60) return `${Math.floor(diffMin)}분 전`;
    const diffHour = diffMin / 60;
    if (diffHour < 24) return `${Math.floor(diffHour)}시간 전`;
    return `${Math.floor(diffHour / 24)}일 전`;
  }

  // 랭킹 탭의 "갱신 시각" 한 줄용 날짜("2026.08.17"). 시:분까지 적으면 "어제 21:35"처럼
  // 지난 시각이 그대로 드러나는데, 갱신이 하루 1회라 날짜 단위 표기가 실제 갱신 주기와도 맞는다
  // (2026-08-17 사용자 확정). 상대시간을 쓰지 않는 이유는 renderMall()의 주석 참조.
  // epoch(초)를 브라우저 로컬 타임존으로 찍는다 — 방문자가 사실상 전부 국내(KST)라
  // data.json을 쓰는 서버와 같은 날짜가 된다.
  function formatSyncedAt(ts) {
    const d = new Date(ts * 1000);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  }

  function render(data) {
    if (data.theme?.accent) {
      document.documentElement.style.setProperty("--accent", data.theme.accent);
    }

    const p = data.profile ?? {};
    document.getElementById("profile").innerHTML = `
      ${
        p.avatar
          ? `<div class="profile-avatar"><img src="${escapeHtml(sanitizeUrl(p.avatar))}" alt="${escapeHtml(p.name)}" /></div>`
          : ""
      }
      <div class="profile-text">
        <h1>${escapeHtml(p.name)}${p.bio ? ` | ${escapeHtml(p.bio)}` : ""}</h1>
      </div>
    `;

    // 오픈채팅방 공지/고정메시지에만 "?src=oc"가 붙은 링크를 걸어두면, 그 채팅방 안에서
    // 들어온 방문자에게는 "이미 있는 채팅방 참여" 버튼을 다시 보여주지 않는다. 그 외
    // 경로(인스타 프로필 등)는 표식 없는 기본 URL을 쓰므로 버튼이 그대로 노출된다.
    const fromOpenChat = new URLSearchParams(location.search).get("src") === "oc";
    const oc = data.openChat ?? {};
    document.getElementById("openchat").innerHTML =
      oc.url && !fromOpenChat
        ? `
        <a class="openchat-button" href="${escapeHtml(sanitizeUrl(oc.url))}" target="_blank" rel="noopener">
          ${escapeHtml(oc.icon ?? "💬")} ${escapeHtml(oc.title ?? "오픈채팅방 참여하기")}
        </a>
      `
        : "";

    document.getElementById("banners").innerHTML = `
      <div class="banner-list">
        ${(data.banners ?? [])
          .map(
            (banner, i) => `
              <a class="banner-card banner-c${(i % 3) + 1}" href="${escapeHtml(sanitizeUrl(banner.url))}" target="_blank" rel="noopener">
                <strong>${escapeHtml(banner.title)}</strong>
                <small>${escapeHtml(banner.description)}</small>
              </a>
            `
          )
          .join("")}
      </div>
    `;

    const malls = data.malls ?? [];

    // ?mall=toss 같은 쿼리 파라미터로 특정 몰 탭을 바로 열 수 있게 함(탭별 공유 링크 지원).
    // 파라미터 값은 화면에 그리지 않고 malls 배열의 id와 정확히 일치하는지 찾는 용도로만 쓰므로
    // 렌더링 경로로 노출되지 않는다. 일치하는 게 없으면 기존처럼 malls[0]로 폴백.
    const requestedMallId = new URLSearchParams(location.search).get("mall");
    const initialMall = malls.find((m) => m.id === requestedMallId) ?? malls[0];

    document.getElementById("mall-tabs").innerHTML = malls
      .map(
        (mall) => `
          <button class="mall-tab-btn${mall === initialMall ? " active" : ""}" data-mall="${escapeHtml(mall.id)}">
            ${escapeHtml(mall.name)}
          </button>
        `
      )
      .join("");

    document.getElementById("mall-tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".mall-tab-btn");
      if (!btn) return;
      document
        .querySelectorAll(".mall-tab-btn")
        .forEach((b) => b.classList.toggle("active", b === btn));
      renderMall(malls.find((m) => m.id === btn.dataset.mall));
    });

    function renderMall(mall) {
      if (!mall) return;
      document.getElementById("mall-disclosure").textContent = mall.disclosure ?? "";

      // 랭킹 탭(BEST50)은 카드마다 상대시간 배지를 붙이지 않고(아래) 목록 위에 마지막 갱신
      // 시각 한 줄만 둔다. 카드 배지가 쓰던 `_ts`는 "그 상품이 랭킹에 처음 진입한 시각"이라
      // 순위와 무관한 값이고, 오래 랭킹에 머문 인기 상품일수록 "6일 전"으로 낡아 보여
      // 실시간 랭킹이 아닌 것처럼 읽혔다. 갱신 시각은 매 사이클 새로 찍히는
      // `_last_synced_ts`의 최댓값 — 같은 사이클에서 쓰인 값이라 사실상 전부 동일하지만,
      // 이전 사이클 잔여 항목이 섞여도 "가장 최근 갱신"이 나오도록 최댓값을 쓴다.
      const syncedTs = (mall.products ?? []).reduce(
        (max, p) =>
          p._rank != null && typeof p._last_synced_ts === "number"
            ? Math.max(max, p._last_synced_ts)
            : max,
        0
      );
      document.getElementById("mall-updated-at").textContent =
        syncedTs > 0 ? `🕒 ${formatSyncedAt(syncedTs)} 기준` : "";

      // 2단 카드 격자가 아니라 1열 리스트로 그린다(2026-08-17 개편) — 상품명이
      // "산해직송 파김치, 1kg, 1개"처럼 긴 식품·생활용품 위주라 격자에서는 늘 잘렸다.
      // 행 전체가 링크다(격자에선 이미지만 링크였다) — 리스트에서는 이름·가격까지
      // 눌러지는 게 자연스럽고 모바일 탭 타깃도 커진다.
      document.getElementById("products").innerHTML = `
        <div class="products-list">
          ${(mall.products ?? [])
            .map((product) => {
              // 순위 숫자는 랭킹 탭(_rank 보유)에만 붙는다 — 카톡 발행분 탭에는 순위 개념이 없다.
              // 숫자로 강제 변환하고 **1 이상**만 통과시킨다: data.json은 외부(토스) 응답에서
              // 온 값이라 문자열("3")·이상값("abc")·0·음수가 들어올 수 있는데, 그대로 그리면
              // "0위" 행이 생기고 `rank <= 3` 판정에도 걸려 1~3위 강조까지 받는다.
              const rank = Number(product._rank);
              const hasRank = Number.isFinite(rank) && rank >= 1;
              return `
              <a class="product-row${hasRank && rank <= 3 ? " product-row-top" : ""}"
                 href="${escapeHtml(sanitizeUrl(product.url))}" target="_blank" rel="noopener">
                ${hasRank ? `<span class="product-rank">${rank}</span>` : ""}
                <img src="${escapeHtml(sanitizeUrl(product.image))}" alt="${escapeHtml(product.name)}" loading="lazy" referrerpolicy="no-referrer" />
                <span class="product-info">
                  <span class="product-name">${escapeHtml(product.name)}</span>
                  <span class="product-price-row">
                    ${
                      product.discount_rate != null
                        ? `<span class="product-discount">${escapeHtml(product.discount_rate)}%</span>`
                        : ""
                    }
                    <span class="product-price">${escapeHtml(product.price)}</span>
                    ${
                      // 랭킹 항목(_rank 보유)은 제외 — 여기 쓰이는 `_ts`가 랭킹 진입 시각이라
                      // 순위와 무관하고, 대신 목록 위 갱신 일자 한 줄로 대체했다(위 주석 참조).
                      product._rank == null && product.priceAt
                        ? `<span class="product-price-at">${formatRelativeTime(product._ts)}</span>`
                        : ""
                    }
                  </span>
                </span>
              </a>
            `;
            })
            .join("")}
        </div>
      `;
    }

    renderMall(initialMall);
  }
</script>

<script data-goatcounter="https://hotdeal.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
